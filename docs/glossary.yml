- term: "Q(1)"
  slug: "q1"
  category: "Primitives"
  definition: >
    First unit object, unity measure, reference for the abstract compute
    unit U. Must have deterministic numeric and metric meaning. Entropy
    may contribute to local identity but must not alter the canonical
    value or unit meaning of Q(1). In the SSL, Q(1) is framed as a
    cryptographically verified utility metric.
  sources:
