      anchor: "#83-dual-ring-pqc-boundary"

- term: "Receipt"
  slug: "receipt"
  category: "Governance"
  definition: >
    A governed record of a transition, fault, halt, rejection, gateway
    decision, or exposure event. Receipts are mandatory for lifecycle
    transitions, gateway crossings, sealing events, export decisions,
    fault translations, halt events, rejections, revocations, capability
    changes, and security-relevant state changes. Receipts are Qn
    artifacts when they must be audited, sealed, verified, or exported.
  sources:
    - doc: "abstractionLayers.md"
      section: "2.2. Fault Translation"
      anchor: "#22-fault-translation"
