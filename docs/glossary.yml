- term: "Layer 0"
  slug: "layer-0"
  category: "Architecture"
  definition: >
    The hardware-agnostic physical substrate. Includes commodity CPU, GPU,
    memory, storage, network interfaces, and physical limits (finite
    memory, compute, energy, thermal constraints, Memory Wall). Layer 0
    is not yet part of the governed Qn universe; it is the acknowledged
    Root of Finiteness.
  sources:
