- term: "Lifecycle State"
  slug: "lifecycle-state"
  category: "Governance"
  definition: >
    The governance status of a Qn artifact. Recognized states include:
    candidate, constructed, sealed, verified, rejected, halted, quarantined,
    exportable, exported, revoked. Lifecycle transitions must be explicit
    and receipted where required. Silent non-termination is forbidden.
  sources:
