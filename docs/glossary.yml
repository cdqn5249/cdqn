- term: "Open Core Invariant"
  slug: "open-core-invariant"
  category: "Governance"
  definition: >
    A non-negotiable core condition that must be preserved in all
    Derivative Works. Two invariants: (a) Anti-Patent Defense — license
    termination upon patent assertion against the Author or project
    community; (b) Non-Scaling Open Access — royalty-free access for
    non-scaling academic, open-source, personal, research, and small-scale
    development.
