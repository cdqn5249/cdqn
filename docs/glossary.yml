      section: "Axiom 3 — Typed Payload Separation"
      anchor: "#axiom-3--typed-payload-separation"
    - doc: "qnPrimitive.md"
      section: "Axiom 9 — Numeric Precision Explicitness"
      anchor: "#axiom-9--numeric-precision-explicitness"
    - doc: "qnPrimitive.md"
      section: "Axiom 10 — No Floating-Point Semantics"
      anchor: "#axiom-10--no-floating-point-semantics"

- term: "Computational Consistency"
  slug: "computational-consistency"
  category: "Constraints"
  definition: >
    The verification methodology of the Qn universe. If the logic is
    internally consistent, and if computations authored in QnLang and
    compiled to QnIR execute successfully and deterministically within
    their declared finite boundaries, the abstractions are considered valid.
  sources:
