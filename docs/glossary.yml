- term: "Existential Invariant"
  slug: "existential-invariant"
  category: "Constraints"
  definition: >
    A Tier 1 SIMEMP constraint that is non-negotiable. The three
    Existential Invariants are Identity, Metric, and Security. If a
    proposed design violates or lacks these, it is fundamentally invalid.
    Invariants cannot be traded off for convenience or performance.
  sources:
    - doc: "simemp.md"
      section: "3.1. Tier 1: Existential Invariants"
      anchor: "#31-tier-1-existential-invariants"
    - doc: "simemp.md"
      section: "5.3. Security Constraints"
      anchor: "#53-security-constraints"
    - doc: "abstractionLayers.md"
      section: "3.2. The No-Implicit Rule"
      anchor: "#32-the-no-implicit-rule"

- term: "Operational Agility"
  slug: "operational-agility"
  category: "Constraints"
  definition: >
    A Tier 2 SIMEMP constraint that is trade-off-able. The three
    Operational Agilities are Efficiency, Modularity, and Portability.
    They naturally conflict with one another and with the Invariants.
    The Golden Rule of Trade-offs applies: always sacrifice an Agility
    to preserve an Invariant.
  sources:
    - doc: "simemp.md"
      section: "3.2. Tier 2: Operational Agilities"
      anchor: "#32-tier-2-operational-agilities"
    - doc: "simemp.md"
      section: "Glossary"
      anchor: "#glossary"

- term: "BOC Policy"
  slug: "boc-policy"
  category: "Constraints"
  definition: >
    Best of Choices. The engineering decision matrix used to resolve
    design conflicts by prioritizing SIMEMP constraints. When paths
    conflict, the BOC mandates selecting the option that most strictly
    aligns with and preserves the SIMEMP constraints.
  sources:
    - doc: "simemp.md"
      section: "7. The BOC Policy"
      anchor: "#7-the-boc-policy"

- term: "Scaling Threshold"
  slug: "scaling-threshold"
  category: "Constraints"
  definition: >
    Usage limits defined by the SSL 1.0 that trigger mandatory commercial
    licensing negotiations. Thresholds include: >10,000 concurrent compute
    nodes/agents, >100,000 MAU, or >10,000,000 API/Qn transactions per month.
  sources:
    - doc: "simemp.md"
      section: "8. Alignment with the Scaling Source License"
      anchor: "#8-alignment-with-the-scaling-source-license"
    - doc: "abstractionLayers.md"
      section: "12.3. Scale Auditing"
      anchor: "#123-scale-auditing"
    - doc: "LICENSE.md"
      section: "1.5. Scale / Scaling Usage"
      anchor: "#15-scale--scaling-usage"

- term: "No-Implicit Rule"
  slug: "no-implicit-rule"
  category: "Constraints"
  definition: >
    In the Qn universe, no implicit entity, behavior, assumption, default,
    interpretation, or convention may cross a SIMEMP Gateway. Only explicit
    Qn objects may pass between layers. Implicitness violates Identity,
    Metric, and Security.
  sources:
