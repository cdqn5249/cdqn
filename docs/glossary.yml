    Security, Identity, Metric, Efficiency, Modularity, Portability.
    The constitutional constraint system governing the Qn and cdqn stack.
    Divided into Tier 1 Existential Invariants (non-negotiable) and
    Tier 2 Operational Agilities (trade-off-able).
