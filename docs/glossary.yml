- term: "QnIR"
  slug: "qnir"
  category: "Primitives"
  definition: >
    Intermediate Representation used for hardware abstraction and bounded
    execution. QnLang compiles to QnIR. The QnIR execution model is not
    yet fully defined. May use binary hardware representations internally
    but must not expose floating-point semantics to the Qn semantic layer.
