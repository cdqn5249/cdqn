- term: "Layer 1"
  slug: "layer-1"
  category: "Architecture"
  definition: >
    The first governed Qn layer. Contains the local genesis Q(0), the
    first unit Q(1), the abstract compute unit U, sign polarity, first
    arithmetic operations, and the first dimensional axis d1. Layer 1
    is where raw hardware state becomes a governed Qn artifact.
  sources:
