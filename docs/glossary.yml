- term: "Complexity Degree"
  slug: "complexity-degree"
  category: "Architecture"
  definition: >
    A structural measure of Qexpr composition depth and governance level.
    Degree 0: primitives (Q(0), Q(1)). Degree 1: primitive operations.
    Degree 2: compositions of degree 1. Degree n: compositions of degree
    n-1. The maximum complexity degree must be bounded and declared.
    May be used as an exposure threshold for public cdqn attestation.
  sources:
    - doc: "abstractionLayers.md"
      section: "5. Complexity Degree Stratification"
      anchor: "#5-complexity-degree-stratification"
