- term: "Q(0)"
  slug: "q0"
  category: "Primitives"
  definition: >
    Local genesis object, origin, causal index zero, empty birth context.
    The foundational numeric couple member representing local origin.
    Q(0) is local; it is not a global universal zero. Each node may have
    its own local Q(0) instance.
