- term: "SIMEMP Gateway"
  slug: "simemp-gateway"
  category: "Architecture"
  definition: >
    The validation boundary between abstraction layers. Only explicit,
    bounded, governed Qn objects may pass. Performs node onboarding,
    fault translation, and DCC profile validation. No implicit entity
    may cross a SIMEMP Gateway.
