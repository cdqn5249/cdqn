- term: "Universal Envelope"
  slug: "universal-envelope"
  category: "Governance"
  definition: >
    The minimal governance structure required for any Qn artifact to
    exist, transform, halt, be sealed, or be exposed. Includes identity,
    type, lifecycle state, lineage, DCC profile, metric envelope,
    security envelope, exposure class, and payload reference.
  sources:
    - doc: "qnPrimitive.md"
      section: "1.2. Qn Primitive Envelope"
      anchor: "#12-qn-primitive-envelope"
