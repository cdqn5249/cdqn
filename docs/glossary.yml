      anchor: "#64-bounded-symbolic-expressions"

- term: "Local-first"
  slug: "local-first"
  category: "Architecture"
  definition: >
    The principle that Qn instances are born locally, indexed locally,
    and not exposed publicly by default. The first identifier component
    of a Qn artifact is local to the node. Remote exposure requires
    explicit authorization, bounded attestation, and compliance with
    the exposure class.
  sources:
