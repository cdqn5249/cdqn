    - doc: "qnPrimitive.md"
      section: "4. Universal Envelope"
      anchor: "#4-universal-envelope"

- term: "Metric Envelope"
  slug: "metric-envelope"
  category: "Governance"
  definition: >
    The finite measurement boundary of a Qn artifact. May include size
    bounds, depth bounds, complexity degree, compute budget, storage
    budget, transmission budget, precision bounds, uncertainty bounds,
    collapse budget, and verification budget. No Qn artifact may be
    unmeasurable. Must support the Memory Wall constraint.
  sources:
    - doc: "qnPrimitive.md"
      section: "1.8. Metric Envelope"
      anchor: "#18-metric-envelope"
    - doc: "qnPrimitive.md"
      section: "4.6. Metric Envelope Reference"
      anchor: "#46-metric-envelope-reference"
    - doc: "qnPrimitive.md"
      section: "8. Metric Envelope Rules"
      anchor: "#8-metric-envelope-rules"
    - doc: "abstractionLayers.md"
      section: "3.4. DCC Profiles Everywhere"
      anchor: "#34-dcc-profiles-everywhere"

- term: "Security Envelope"
  slug: "security-envelope"
  category: "Governance"
  definition: >
    The governed security boundary of a Qn artifact. Declares capability
    limits, export rights, delegation rights, halt authority, revocation
    path, identity class, trust assumptions, algorithm identifiers, and
    algorithm agility metadata. Security is defined against finite
    adversaries, not absolute adversaries. Must respect the dual-ring
    PQC boundary.
  sources:
    - doc: "qnPrimitive.md"
      section: "1.9. Security Envelope"
      anchor: "#19-security-envelope"
    - doc: "qnPrimitive.md"
      section: "4.7. Security Envelope Reference"
      anchor: "#47-security-envelope-reference"
