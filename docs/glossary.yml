- term: "Causal Arrow"
  slug: "causal-arrow"
  category: "Architecture"
  definition: >
    A persistent, monotonic ordering of computational events independent
    of physical wall-clock time. Every Qn object is born into a local
    Causal Arrow. The birth order is finite, bounded, and acyclic.
    Distributed security relies on the Causal Arrow, not wall-clock time.
  sources:
