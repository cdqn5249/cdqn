- term: "Qexpr"
  slug: "qexpr"
  category: "Primitives"
  definition: >
    A governed expression composed of Qn objects. Carries symbolic
    structure, zoom z, remainder r, dimension d, DCC profile, identity,
    and lineage. Collapses to a concrete governed value at compilation
    time (QnLang to QnIR transition). Symbolic expression size must be
    bounded.
