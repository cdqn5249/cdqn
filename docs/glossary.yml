- term: "Abstraction Layer"
  slug: "abstraction-layer"
  category: "Architecture"
  definition: >
    A structural boundary in the Qn stack where governed Qn objects are
    born, transformed, or exposed under SIMEMP constraints. Layer 0 is
    the commodity physical substrate; Layer 1 is the first governed Qn
    layer. Higher layers are derived sequentially.
  sources:
