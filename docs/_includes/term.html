{%- assign entry = site.data.glossary | where: "slug", include.id | first -%}
{%- if entry -%}
<span class="glossary-wrapper" data-definition="{{ entry.definition | strip | escape }}"><a href="{{ '/glossary.html' | relative_url }}#{{ entry.slug }}" class="glossary-link" data-definition="{{ entry.definition | strip | escape }}">{% if include.text %}{{ include.text }}{% else %}{{ entry.term }}{% endif %}</a></span>
{%- else -%}
<span class="glossary-missing">{{ include.text | default: include.id }}</span>
{%- endif -%}
