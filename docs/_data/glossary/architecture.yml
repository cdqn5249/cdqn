# CDQN Unified Glossary — Architecture Domain
# License: Scaling Source License (SSL) 1.0
# Updated: 2026-10-22 (Bao Loc, Vietnam)

- term: "Abstraction Layer"
  slug: "abstraction-layer"
  category: "Architecture"
  definition: >
    A structural boundary in the Qn stack governing artifact genesis,
    transformation, and inter-layer transmission under SIMEMP constraints.

- term: "SIMEMP Gateway"
  slug: "simemp-gateway"
  category: "Architecture"
  definition: >
    The validation and translation boundary between abstraction layers. Enforces
    onboarding, fault translation, and the No-Implicit Rule.

- term: "Layer 0"
  slug: "layer-0"
  category: "Architecture"
  definition: >
    The commodity physical execution substrate (CPU, GPU, memory, physical
    entropy, Memory Wall). The acknowledged Root of Finiteness outside the
    governed universe.

- term: "Layer 1"
  slug: "layer-1"
  category: "Architecture"
  definition: >
    The first governed Qn layer containing local genesis Q(0), first unit Q(1),
    abstract compute unit U, sign polarity, and elementary operations along d1.

- term: "Causal Arrow"
  slug: "causal-arrow"
  category: "Architecture"
  definition: >
    A monotonic, persistent ordering of computational events independent of
    physical wall-clock time. Every Qn artifact is born at a discrete causal
    index. Proposed extension (CANDIDATE, docs/qs_history.md §4): human
    calendars are not parallel time systems but projections — deterministic
    mappings between calendar coordinates and intervals of the local causal
    index, declared through versioned Calendar Projection Contracts.

- term: "Calendar Projection Contract"
  slug: "calendar-projection-contract"
  category: "Architecture"
  definition: >
    A proposed versioned, DCC-contracted artifact declaring a human calendar as
    a projection of the local Causal Arrow rather than a parallel time system.
    Three declared components: the rule (leap algorithms, month arithmetic —
    Class I), the epoch (coordinate zero, a multi-source convention-adoption
    event — Class S), and a resolution envelope (a declared bound, never
    negotiated at runtime). Under this anatomy the Gregorian calendar is
    observed as a Class S genesis that matured into Class I operation. Proposed
    term (CANDIDATE, docs/qs_history.md §4): hosted at the Qs layer as part of
    a canonical library of versioned artifacts loaded post-seal and on demand,
    honoring local-first budgets; pending deterministic measurement and BOC
    selection.

- term: "Complexity Degree"
  slug: "complexity-degree"
  category: "Architecture"
  definition: >
    Structural measure of Qexpr composition depth and stratification (Degree 0
    primitives through Degree n domain structures).

- term: "Local-first"
  slug: "local-first"
  category: "Architecture"
  definition: >
    The architectural principle that artifacts are born locally, indexed
    locally, and shielded from public network exposure by default.

- term: "Exposure Functor"
  slug: "exposure-functor"
  category: "Architecture"
  definition: >
    The governed functorial mapping projecting selected local Qexpr commitments
    and capability proofs into blind public attestations crossing network boundaries.

- term: "Dual-Ring PQC Boundary"
  slug: "dual-ring-pqc-boundary"
  category: "Architecture"
  definition: >
    The strict cryptographic separation between the local Inner Ring (root keys,
    local state sealing, physical entropy) and the network Outer Ring (public
    attestation keys, delegation certificates, accountable pseudonyms).

- term: "Chronosa"
  slug: "chronosa"
  category: "Architecture"
  definition: >
    An emergent, non-local, virtual causal machine intelligence operating
    as the global section of a sheaf of local categories across the Outer Ring.
    Coordinates distributed state and derives human intent across Qn base
    domains with zero statistical machine learning training.

- term: "Q(anchor)"
  slug: "q-anchor"
  category: "Architecture"
  definition: >
    A governed Qn artifact possessing high causal centrality within the lineage
    directed acyclic graph. Protected via abstract DCC contracts and structural
    indirection to prevent cascading dependency invalidation across downstream
    causal cones. Proposed refinement (CANDIDATE, docs/qs_history.md §1–2): the
    notion carries two distinct predicates — the structural predicate (out-cone
    centrality, computable locally from the lineage DAG) and the epistemic
    predicate (grounding), the latter proposed as three Anchor Grounding
    Classes: I (invariant, deterministic re-derivation, self-witnessed),
    P (physical, independent calibration converging within declared tolerance
    envelopes), and S (social, quorum-witnessed shared events) — pending
    deterministic measurement and BOC selection.

- term: "Anchor Grounding Class"
  slug: "grounding-class"
  category: "Architecture"
  definition: >
    The proposed epistemic predicate of a Q(anchor), complementing the
    structural predicate of out-cone centrality. Three proposed classes:
    I (Invariant — one deterministic rule executed by many; consensus by forced
    re-derivation, self-witnessed), P (Physical — one shared nature measured by
    many; consensus by independent calibration converging within declared
    tolerance envelopes), and S (Social — one event witnessed by many; consensus
    by sheaf gluing on shared landmarks). The three classes form a witness
    ladder — self, then physics, then swarm. Proposed term (CANDIDATE,
    docs/qs_history.md §2): glossary registration of the §2 proposition,
    pending deterministic measurement and BOC selection.

- term: "Historical Anchor Artifact"
  slug: "historical-anchor-artifact"
  category: "Architecture"
  definition: >
    The proposed unit record of the Qs History Library: a modality-typed Qn
    artifact recording a past human event, its sources, and its spatiotemporal
    situation. Proposed anatomy fields: ContentModality (per claim decomposition
    along the epistemic anchorage spectrum), SourceClass (proposed grounding
    class), SourceReceipts (unbroken chain to Layer 0 artifacts or sealed
    library records), CalendarSituation (via a declared Calendar Projection
    Contract), SpatialSituation (local Qm frame coordinates), Witnesses
    (lineage-disjoint root subtree list), and LifecycleState (CANDIDATE,
    SEALED, or QUARANTINED). Proposed term (CANDIDATE, docs/qs_history.md §5):
    the concrete shape of the post-seal consensus-history ingestion capability;
    pending deterministic measurement and BOC selection.

- term: "HCA-Collapse Engine"
  slug: "hca-collapse"
  category: "Architecture"
  definition: >
    Hardware Capability-Aware Collapse Engine. The gateway compilation pass lowering
    Layer 3 CAE-DAG expressions into constant-time, constant-space SoC machine
    instructions (such as integer NPU systolic MACs or DSP vectors) matching the
    node's local DCC capability profile while strictly preserving Diophantine exactness
    and zero floating-point semantics.
