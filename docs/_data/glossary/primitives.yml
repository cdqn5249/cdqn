- term: "Zoom z"
  slug: "zoom-z"
  category: "Primitives"
  definition: >
    The declared precision boundary, metric resolution quantum, or discrete
    scale level of a governed numeric expression. Parameterizes projective
    resolution lattices while remaining base-independent in core representations.

- term: "Remainder r"
  slug: "remainder-r"
  category: "Primitives"
  definition: >
    The conserved residual quantity preserved at a declared zoom level or
    division constraint. Acts as the exact input state and generator for
    subsequent zoom scale expansion along dimension d, preventing precision decay
    and replacing IEEE 754 rounding approximations.

- term: "Dimension d"
  slug: "dimension-d"
  category: "Primitives"
  definition: >
    A governed dimensional coordinate axis or geometric orientation parameterizing
    a Qn entity, beginning with axis d1 derived from genesis origin Q(0) and unit Q(1).

- term: "Qn"
  slug: "qn"
  category: "Primitives"
  definition: >
    Quang Number. A governed, finite, identifiable, measurable, and
    security-constrained computational artifact within the Qn universe.

- term: "Q(0)"
  slug: "q0"
  category: "Primitives"
  definition: >
    Local genesis object, causal origin zero, empty birth context. Strictly
    local to each node; no universal global zero is admitted.

- term: "Q(1)"
  slug: "q1"
  category: "Primitives"
  definition: >
    First unit artifact, unity measure, and baseline reference for the
    abstract compute unit U along dimensional axis d1.

- term: "Abstract Compute Unit U"
  slug: "compute-unit-u"
  category: "Primitives"
  definition: >
    The fundamental, invariant quantum of governed computational work representing
    the minimal state transition from local genesis Q(0) to first unit Q(1) along
    dimensional axis d1. Calibrated to physical Landauer dissipation limits
    (W >= k_B T ln 2) to maintain platform-invariant accounting across
    heterogeneous hardware substrates.

- term: "Successor Morphism S"
  slug: "successor-morphism"
  category: "Primitives"
  definition: >
    The discrete algebraic transition function S(x) = x + Q(1) generating
    sequential integer artifacts inductively along dimensional axis d1 without
    continuous or floating-point approximations.

- term: "Q(even)"
  slug: "q-even"
  category: "Primitives"
  definition: >
    The constructive parity partition of integers whose Diophantine division by
    Q(2) yields a remainder identically equal to genesis origin Q(0),
    demonstrating modulo-2 Terminal Exactness. Includes local genesis origin Q(0).

- term: "Q(odd)"
  slug: "q-odd"
  category: "Primitives"
  definition: >
    The constructive parity partition of integers whose Diophantine division by
    Q(2) yields a remainder identically equal to first unit Q(1).

- term: "Qm"
  slug: "qm"
  category: "Primitives"
  definition: >
    Quang Mathematics. The local-first constructive algebraic, numeric, and
    relational base domain of the Qn universe. Operates over discrete tuples
    ⟨σ, q_z, z, r_z, d⟩ without floating-point mechanics, enforcing Diophantine
    division constraints, projective remainder conservation, and positional
    order decidability.

- term: "Qlog"
  slug: "qlog"
  category: "Primitives"
  definition: >
    Quang Logics. An emergent composite domain derived from the categorical
    tensor product of Quang Mathematics and Quang Semantics (Qm ⊗ Qs). Formalizes
    constructive type theory, intuitionistic propositional deduction, and
    automated proof verification without ungrounded non-constructive axioms.

- term: "Qbio"
  slug: "qbio"
  category: "Primitives"
  definition: >
    Quang Biology. An emergent biosemiotic domain derived from the categorical
    tensor product of Quang Chemistry and Quang Semantics (Qchem ⊗ Qs).
    Models living metabolic homeostasis, genetic codon information channels,
    cellular automata, and active inference operating as bounded SIMEMP open systems.

- term: "Q(reuse)"
  slug: "q-reuse"
  category: "Primitives"
  definition: >
    A Category B optimization morphism that references existing immutable content
    commitment hashes within the local causal DAG instead of allocating new
    physical memory bits. Admission is conditional, never automatic: the
    two-axis consequentiality breakeven admits the lookup only when the direct
    compute path is consequently faster — its declared work bound ΔW_compute
    and latency bound Δt_compute_bound must each clear the touched tier's
    declared lookup bounds τ_U[tier(h)] + ε_U and τ_t[tier(h)] + ε_t by the
    declared Advantage Margin factors (κ_dcc on the work axis, κ_t on the
    latency axis of the Latency Telemetry Envelope) — so the Memory Wall
    delay is harvested rather than suffered. The exchange is accounted
    through the Admission Ledger (W_gross_reserve, W_actual_charge,
    W_refund, W_net) over declared deterministic quantities, never runtime
    samples; failed margins, ties, and undeclared terms fall back to Direct
    Compute. When admitted, the lookup eliminates redundant re-derivation
    while charging the declared lookup cost.

- term: "Q(bypass)"
  slug: "q-bypass"
  category: "Primitives"
  definition: >
    A Category B optimization morphism allowing a SIMEMP Gateway to short-circuit
    execution steps when algebraic preconditions prove an invariant identity
    transition (such as Terminal Exactness r = Q(0) or multiplication by unit Q(1)).
    Emits an explicit zero-cost bypass receipt without consuming compute budgets.

- term: "cdqn"
  slug: "cdqn"
  category: "Primitives"
  definition: >
    Chained and Distributed Quang Numbers. The universal fractal protocol of
    governed data movement, operating both locally (intra-node causal chaining
    between abstraction layers and base domains) and distributively (inter-node
    public attestations across physical networks).

- term: "QnLang"
  slug: "qnlang"
  category: "Primitives"
  definition: >
    The high-level domain-specific language used to author Qn computations,
    enforcing explicit DCC profiles and compile-time collapse.

- term: "QnIR"
  slug: "qnir"
  category: "Primitives"
  definition: >
    Intermediate Representation used for hardware abstraction, bound
    enforcement, and deterministic execution without exposing floating-point
    semantics.

- term: "Qexpr"
  slug: "qexpr"
  category: "Primitives"
  definition: >
    Governed expression tuple encapsulating symbolic structure, zoom, remainder,
    dimension, DCC profile, identity, and causal lineage. Structured as a
    Content-Addressed Expression DAG (CAE-DAG) with hash-consing.

- term: "Q(rsi)"
  slug: "qn-rsi"
  category: "Primitives"
  definition: >
    A higher-order recursive self-optimization workflow. Ingests an existing
    Q(workflows) artifact, derives an empirically more efficient successor under
    strict semantic invariance and finite metric budget, and emits a versioned
    successor artifact.

- term: "Content-Addressed Expression DAG"
  slug: "cae-dag"
  category: "Primitives"
  definition: >
    The canonical Layer 3 structural container of Qexpr, wherein every symbolic
    node is irrevocably identified by the cryptographic commitment hash of its
    operator, parameters, and child dependencies. Guarantees mathematical cycle
    freedom by construction and enables O(1) structural equivalence comparisons.

- term: "Discrete Exterior Calculus"
  slug: "discrete-exterior-calculus"
  category: "Primitives"
  definition: >
    The constructive formulation of calculus operating on discrete simplicial
    meshes and cochains, replacing continuous partial differential equations with
    exact algebraic coboundary operators without floating-point approximations.

- term: "Discrete Exterior Derivative d"
  slug: "discrete-exterior-derivative"
  category: "Primitives"
  definition: >
    The discrete coboundary operator mapping k-forms to (k+1)-forms across
    simplicial complexes. Satisfies the exact topological nilpotency invariant
    d ∘ d = Q(0), grounding electromagnetic and fluid conservation laws.

- term: "Discrete Hodge Star"
  slug: "discrete-hodge-star"
  category: "Primitives"
  definition: >
    The geometric duality operator mapping primal simplicial k-forms to dual
    circumcentric (n-k)-forms, parameterizing exact dual volume ratio quotients.

- term: "Qs"
  slug: "qs"
  category: "Primitives"
  definition: >
    Quang Semantics. The constructive relational, linguistic, and intent base
    domain of the Qn universe. Formalizes words as multivector blades, grammar as
    CAE-DAG wiring, and human-machine communication as verifiable intent contracts.

- term: "Q(patterns)"
  slug: "q-patterns"
  category: "Primitives"
  definition: >
    An invariant, reproducible state-transition template mapping input commitments
    to deterministic output milestones under abstract DCC contracts. Encompasses
    both exact algebraic transformations and deterministic terminal fault signatures.

- term: "Q(workflows)"
  slug: "q-workflows"
  category: "Primitives"
  definition: >
    A composite, goal-directed causal directed acyclic graph assembling multiple
    Q(patterns) under a declared Intent Contract and finite Metric Budget.
    Portable across any cdqn node via chained Road Receipts.

- term: "Qphy"
  slug: "qphy"
  category: "Primitives"
  definition: >
    Quang Physics. The local-first constructive physical base domain of the
    Qn universe. Models non-equilibrium computational thermodynamics, discrete
    exterior cochain field dynamics, Landauer dissipation bounds, and physical
    Q(anchor) invariants directly grounded in Layer 0 silicon substrates.

- term: "Q(event)"
  slug: "q-event"
  category: "Primitives"
  definition: >
    A discrete computational or physical state transition occurring at an
    explicit spatiotemporal coordinate, carrying a discrete scale quantum,
    a state transition payload, and a verified epistemic modality.

- term: "Qchem"
  slug: "qchem"
  category: "Primitives"
  definition: >
    Quang Chemistry. An emergent composite domain derived from the categorical
    tensor product of Quang Physics and Quang Mathematics (Qphy ⊗ Qm).
    Models discrete stoichiometric balance equations, molecular bonding graphs,
    reaction kinetics, and Gibbs free energy dissipation without semantic intent.

- term: "Axiom 6"
  slug: "axiom-6"
  category: "Primitives"
  definition: >
    Totality of Governed Operations. Every governed operation carries an
    explicit work ceiling in Abstract Compute Units U: execution either
    reaches Terminal Exactness (R = Q(0)) or halts cleanly upon budget
    exhaustion, emitting a signed receipt. Unbounded, non-terminating state
    transitions are physically impossible in the Qn universe.

- term: "Q(dataStruc)"
  slug: "q-datastruc"
  category: "Primitives"
  definition: >
    Governed immutable memory container artifact class providing bounded,
    content-addressed storage within the local causal DAG. Allocation, reading,
    and writing are explicit governed morphisms subject to DCC constraints and
    Memory Wall envelopes; no implicit heap state is admitted.

- term: "Q(th_2)"
  slug: "q-th-2"
  category: "Primitives"
  definition: >
    Physical invariant anchor encoding the Second Law. Calibrated from sampled
    thermal receipts via ln 2 dissipation quanta, it mandates that endergonic
    processes execute only under a declared Gibbs free-energy budget
    (DCC_ANCHOR_SECOND_LAW_v1).

- term: "Q(c)"
  slug: "q-c"
  category: "Primitives"
  definition: >
    Physical invariant anchor of the relativistic causal horizon. Calibrated
    from local dielectric propagation delays, it bounds causally ordered state
    propagation across the substrate (DCC_ANCHOR_CAUSAL_HORIZON_v1).

- term: "Q(ℏ)"
  slug: "q-hbar"
  category: "Primitives"
  definition: >
    Physical invariant anchor of quantum action. Built from height ceilings
    and quantum action limits, it forbids unmetered infinite information
    density in finite registers (DCC_ANCHOR_ACTION_PLANCK_v1).

- term: "Q(Z_bus)"
  slug: "q-z-bus"
  category: "Primitives"
  definition: >
    Physical invariant anchor of the Memory Wall. Built from parasitic wire
    capacitance and bus line physics, it calibrates transport latency and
    bandwidth ceilings of the substrate (DCC_ANCHOR_MEMORY_WALL_v1).

- term: "Q(gauge)"
  slug: "q-gauge"
  category: "Primitives"
  definition: >
    Physical invariant anchor of topological conservation. Built from
    simplicial mesh topology and discrete coboundary verification, it grounds
    conserved field quantities without metric drift (DCC_ANCHOR_DEC_D_v1).

- term: "Q(array)"
  slug: "q-array"
  category: "Primitives"
  definition: >
    The proposed sequenced container contract surface: a bounded, indexed
    container whose footprint is a declared length, whose permitted access is
    indexed, whose locality class is contiguous, and whose traversal order is
    fixed by causal index with constant declared work per indexed access.
    Grounded in the OP_FOLD child vector under an explicit step ceiling, it
    admits no in-place mutation: growth emits a new versioned artifact. A
    contract surface under the five-row structural contract schema, never a
    runtime shape; pending deterministic measurement, BOC selection, and
    Q(rsi) sealing.

- term: "Q(matrix)"
  slug: "q-matrix"
  category: "Primitives"
  definition: >
    The proposed geometric container contract surface: a bounded,
    two-dimensional integer container whose contractions complete in constant
    declared time through the integer Matrix-Multiply-Accumulate lowering,
    preserving exactness by construction without floating-point drift, and
    admitting the Q(bypass) morphism to short-circuit identity preconditions
    in register time. Grounded in the OP_FRAME_MAP node class. A contract
    surface under the five-row structural contract schema, never a runtime
    shape; pending deterministic measurement, BOC selection, and Q(rsi)
    sealing.

- term: "Q(table)"
  slug: "q-table"
  category: "Primitives"
  definition: >
    The proposed keyed container contract surface: a bounded, content-addressed
    lookup structure grounded in hash-consing itself, the Content-Addressed
    Expression DAG already constituting a keyed index over committed
    expressions. Capacity is declared; growth is re-versioning rather than
    resizing; the work row declares the Two-Axis Consequentiality Breakeven
    under which keyed lookup is admitted over its recorded alternatives, in
    the manner of the committed Q(reuse) analysis: admission is conditional,
    never automatic — the direct compute path must be consequently faster, its
    declared work bound ΔW_compute and latency bound Δt_compute_bound each
    clearing the touched tier's declared lookup bounds τ_U[tier(h)] + ε_U and
    τ_t[tier(h)] + ε_t by the declared Advantage Margin factors (κ_dcc on the
    work axis, κ_t on the latency axis of the Latency Telemetry Envelope);
    failed margins, ties, and undeclared terms fall back to Direct Compute.
    A contract surface under the five-row
    structural contract schema, never a runtime shape; pending deterministic
    measurement, BOC selection, and Q(rsi) sealing.

- term: "Q(stream)"
  slug: "q-stream"
  category: "Primitives"
  definition: >
    The proposed bounded stream contract surface for sequenced data: declared
    capacity with sequenced, append-ordered access fixed by causal index.
    Bounded streams are already exercised, through declared sample volumes in
    entropy measurement and append-only receipt chains, while no container
    type is committed; an implicitly resizable queue would violate the
    footprint and determinism rows and is not admitted. Nominated as an open
    contract shape under the five-row structural contract schema, never a
    runtime shape; pending implementation feedback, deterministic measurement,
    BOC selection, and Q(rsi) sealing.

- term: "Latency Telemetry Envelope"
  slug: "latency-telemetry-envelope"
  category: "Primitives"
  definition: >
    The latency axis of the two-axis Layer-0 Hardware Telemetry Envelope: a
    DCC-declared per-tier worst-case lookup bound table
    τ_t = { τ_reg, τ_L1, τ_L2, τ_L3, τ_DRAM, τ_storage, τ_remote }, expressed
    in cycles against the node's declared reference clock and calibrated at
    Layer-0 onboarding through the Historical Calibration Benchmark receipt
    class. A worst-case declared bound — never a runtime sample — is the only
    admissible form, preserving the Observational Determinism Invariant and
    receipt replay by construction. The envelope gates resource admission and
    receipt auditing at the node boundary and never feeds back into logical
    budgets; its twin energy axis carries the α_compute/β_bus coefficients.
    It supplies the latency axis of the Q(reuse) admission predicate together
    with the Advantage Margin.

- term: "Advantage Margin"
  slug: "advantage-margin"
  category: "Primitives"
  definition: >
    The DCC-declared factor by which the direct compute path must exceed the
    touched memory tier's declared lookup bound on each axis of the two-axis
    admission predicate: κ_dcc on the work axis and κ_t on the latency axis.
    Declared per profile within the governance-bounded range [1, 64], with
    the recommended preset κ_dcc = 2, κ_t = 4 encoding the memory-wall
    asymmetry: the work axis is already bounded by the declared cost model,
    while the latency axis carries the machine-condition variance of the
    wall. Both preset values are powers of two for deterministic scaling
    semantics. The floor excludes bare breakeven — the direct path must be
    consequently faster, and ties resolve to Direct Compute — while the
    ceiling bounds margin inflation.
